<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found | Usman Arshad</title><style>:root{--paper:#f4f1e8;--ink:#17211d;--acid:#d6f45b;--rust:#ae4b30}*{box-sizing:border-box}body{margin:0;background:var(--acid);color:var(--ink);font-family:Arial,sans-serif}.page{min-height:100svh;padding:clamp(2rem,7vw,7rem);display:grid;align-content:center}.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em}.label:before{content:"";display:inline-block;width:.55rem;height:.55rem;margin-right:.6rem;border-radius:50%;background:var(--rust)}h1{font:clamp(4rem,12vw,10rem)/.85 Georgia,serif;letter-spacing:-.06em;margin:2rem 0}p{max-width:34rem;line-height:1.6}.home{display:grid;place-items:center;width:9rem;height:9rem;margin-top:2rem;border-radius:50%;background:var(--ink);color:var(--paper);font:1.3rem Georgia,serif;text-decoration:none}</style></head><body><main class="page"><p class="label">Error 404</p><h1>This page<br>isn’t here.</h1><p>The address may have changed, or the link may be incomplete.</p><a class="home" data-home href="./">Go home ↗</a></main><script>if(location.hostname.endsWith('github.io')){const first=location.pathname.split('/').filter(Boolean)[0];document.querySelector('[data-home]').href=first?'/'+first+'/':'/'}</script></body></html>
